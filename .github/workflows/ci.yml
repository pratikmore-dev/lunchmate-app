name: LunchMate CI

on:
  push:
    branches: [ main ]       # runs on every push to main
  pull_request:
    branches: [ main ]       # runs on every PR to main

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Restore packages
      - name: Restore dependencies
        run: dotnet restore Lunchmate-server/Lunchmate.sln

      # 4. Build
      - name: Build
        run: dotnet build Lunchmate-server/Lunchmate.sln --no-restore

      # 5. Run tests
      - name: Run tests
        run: dotnet test Lunchmate-server/Lunchmate.Tests/Lunchmate.Tests.csproj --no-build --verbosity normal

  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test              # ← only runs if tests pass ✅

    steps:
      # 1. Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build & Push Backend
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./Lunchmate-server
          dockerfile: ./Lunchmate-server/Lunchmate.API/Dockerfile
          push: true
          tags: pratikmore82/lunchmate-backend:latest

      # 4. Build & Push Frontend
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Lunchmate-client
          dockerfile: ./Lunchmate-client/Dockerfile
          push: true
          tags: pratikmore82/lunchmate-frontend:latest